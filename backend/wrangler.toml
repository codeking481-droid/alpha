name = "alphatekx-agency-backend"
main = "src/index.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENV = "production"

# D1 Database - create with: npx wrangler d1 create alphatekx-db
# [[d1_databases]]
# binding = "DB"
# database_name = "alphatekx-db"
# database_id = "REPLACE_AFTER_CREATE"

# R2 Storage - create with: npx wrangler r2 bucket create alphatekx-storage
# [[r2_buckets]]
# binding = "STORAGE"
# bucket_name = "alphatekx-storage"

# AI Binding for Groq via Workers AI (Workers AI) - optional
# [ai]
# binding = "AI"

# Uncomment to set Groq key via secrets: npx wrangler secret put GROQ_API_KEY
# [observability]
# enabled = true
