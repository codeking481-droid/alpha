name = "alpha-agency-api"
main = "src/index.js"
compatibility_date = "2024-12-18"
compatibility_flags = ["nodejs_compat"]

[vars]
ENV = "production"

# Supabase — create project at https://supabase.com then set:
# npx wrangler secret put SUPABASE_URL
# npx wrangler secret put SUPABASE_ANON_KEY
# Optional service key for writes: SUPABASE_SERVICE_KEY
# See supabase.sql for tables (backend/supabase.sql)

# Groq — https://console.groq.com/keys
# npx wrangler secret put GROQ_API_KEY
# npx wrangler secret put ACCESS_CODES  # comma-separated, e.g. ALPHA2024,TEAM123

# Paystack — USD $50 / $99 — https://dashboard.paystack.com/#/settings/developer
# npx wrangler secret put PAYSTACK_SECRET_KEY   # sk_test_... or sk_live_...
# npx wrangler secret put PAYSTACK_CURRENCY     # USD (default for $50/$99) — set to NGN only if you want Naira
# Optional: npx wrangler secret put FRONTEND_URL        # e.g. https://alphatekx.name.ng

# D1 (alternative to Supabase) — npx wrangler d1 create alphatekx-db
# [[d1_databases]]
# binding = "DB"
# database_name = "alphatekx-db"
# database_id = "REPLACE_AFTER_CREATE"

# R2 — npx wrangler r2 bucket create alphatekx-storage
# [[r2_buckets]]
# binding = "STORAGE"
# bucket_name = "alphatekx-storage"

# [observability]
# enabled = true
